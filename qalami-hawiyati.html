<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>قلمي هويتي</title>

<style>
/* Layout: phone notebook — week list on top, each week opens a practice sheet with model letters, tracing pad and a 7-day home log. */
:root{

}

:root[data-theme="dark"]{--bg:#15120E;--paper:#1F1A14;--sunk:#2A231B;--line:#3A3127;--fg:#EFE7DA;--muted:#B3A690;--ink:#9DB7EA;--red:#E58A78;--ok:#6ED29A;--ok-soft:#173022;--gold:#E2B456;--rule:#3A3127;--on:#15120E;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.days button b{font-size:20px;line-height:1}
.days button[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}.meter i{display:block;height:100%;background:var(--ok);border-radius:99px}
.note{font-size:13px;color:var(--muted);margin:0}
.badge{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:12px;padding:10px 12px;font-weight:600}
.badge i{font-style:normal;font-size:26px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const D={"weeks":[{"n":0,"k":"pre","t":"القياس القبلي","d":"الأحد 19/6/1448هـ","dg":"29/11/2026م","note":"يكتب الطالب النص الموحد في المدرسة يوم الأحد 19/6/1448هـ، ويقيّمه معلم اللغة العربية ببطاقة التقييم، ثم يبدأ التدريب في المنزل من اليوم نفسه.","days":[],"s":null,"from":"2026-11-29","to":"2026-11-29"},{"n":1,"k":"w","t":"عائلة الباء والنون والياء","L":["ب","ت","ث","ن","ي"],"d":"الأحد 19/6 – الثلاثاء 21/6/1448هـ","dg":"29/11 – 1/12/2026م","tips":["تُكتب الباء والتاء والثاء في الرقعة قصيرة مستقيمة، جالسة على السطر.","النقطتان في الرقعة تُكتبان شرطة صغيرة واحدة، والنقاط الثلاث كقوس صغير مقلوب.","النون في آخر الكلمة تنزل تحت السطر بنصف دائرة، والياء في آخرها ترجع بذيل إلى اليمين."],"err":["إطالة الباء أكثر من اللازم","كتابة النقاط منفصلة بدل الشرطة","رفع الحروف عن السطر"],"words":["بيت","نبات","ثبات","تين","بني"],"s":"التسامح يبني بيننا جسور المحبة","days":["الأحد","الاثنين","الثلاثاء"],"from":"2026-11-29","to":"2026-12-01"},{"n":2,"k":"w","t":"عائلة الجيم والعين","L":["ج","ح","خ","ع","غ"],"d":"الأربعاء 22/6 – الجمعة 24/6/1448هـ","dg":"2 – 4/12/2026م","tips":["رأس الجيم والحاء والخاء يُكتب على السطر بخط مائل قصير، ثم ينزل الجسم تحت السطر.","العين في أول الكلمة رأسها صغير مفتوح، وفي آخرها ينزل ذيلها تحت السطر.","حافظ على تساوي حجم الرؤوس في الكلمة الواحدة."],"err":["تكبير الرأس أكثر من الجسم","إغلاق رأس العين","عدم النزول تحت السطر"],"words":["حج","خير","علم","غيم","جميع"],"s":"العلم نور يضيء طريق الحياة","days":["الأربعاء","الخميس","الجمعة"],"from":"2026-12-02","to":"2026-12-04"},{"n":3,"k":"w","t":"عائلة الدال والراء والواو","L":["د","ذ","ر","ز","و"],"d":"السبت 25/6 – الاثنين 27/6/1448هـ","dg":"5 – 7/12/2026م","tips":["الدال والذال صغيرتان، تجلسان على السطر بزاوية واضحة.","الراء والزاي تنزلان تحت السطر بميل خفيف إلى اليسار.","الواو رأسها دائرة صغيرة على السطر، وذيلها ينزل تحت السطر كالراء."],"err":["كتابة الدال بحجم الراء","رسم الراء أفقية فوق السطر","تكبير رأس الواو"],"words":["ورد","زرع","ذرة","دار","زاد"],"s":"نزرع الورد ليزدان الدار","days":["السبت","الأحد","الاثنين"],"from":"2026-12-05","to":"2026-12-07"},{"n":4,"k":"w","t":"عائلة السين والصاد والطاء","L":["س","ش","ص","ض","ط","ظ"],"d":"الثلاثاء 28/6 – الخميس 1/7/1448هـ","dg":"8 – 10/12/2026م","tips":["السين والشين في الرقعة تُكتبان غالبًا ممدودتين دون أسنان.","رأس الصاد والضاد بيضاوي صغير مائل، يجلس على السطر.","الطاء والظاء رأسهما كالصاد، وعصا قائمة مائلة قليلًا."],"err":["رسم أسنان السين كما في النسخ","تضخيم رأس الصاد","ميل عصا الطاء بشدة"],"words":["شمس","صبر","ضوء","طريق","ظل"],"s":"الصبر طريق النجاح","days":["الثلاثاء","الأربعاء","الخميس"],"from":"2026-12-08","to":"2026-12-10"},{"n":5,"k":"w","t":"عائلة الفاء والكاف واللام والميم","L":["ف","ق","ك","ل","م"],"d":"الجمعة 2/7 – الأحد 4/7/1448هـ","dg":"11 – 13/12/2026م","tips":["الفاء والقاف رأسهما صغير مستدير، والقاف في آخر الكلمة تنزل تحت السطر بنصف دائرة.","اللام قائمة مستقيمة بطول الألف تقريبًا، وفي آخر الكلمة ينزل ذيلها تحت السطر.","الميم دائرة صغيرة على السطر، ولها في آخر الكلمة ذيل قصير ينزل تحت السطر."],"err":["كتابة اللام أقصر من الألف","تكبير دائرة الميم","رفع رأس الفاء عن السطر"],"words":["قلم","فكر","كتاب","لطف","معلم"],"s":"القلم سلاح المتعلم","days":["الجمعة","السبت","الأحد"],"from":"2026-12-11","to":"2026-12-13"},{"n":6,"k":"w","t":"الهاء والألف والربط بين الحروف","L":["ه","ة","ا","لا","ء"],"d":"الاثنين 5/7 – الأربعاء 7/7/1448هـ","dg":"14 – 16/12/2026م","tips":["الألف قائمة مستقيمة، وهي مقياس أطوال الحروف في الكلمة.","لام الألف (لا) تُكتب متصلة بحركة واحدة، بفتحة متساوية بين الجانبين.","اربط الحروف دون رفع القلم قدر الإمكان، وحافظ على مسافات متساوية بين الكلمات."],"err":["تفاوت أطوال الألفات في السطر","مسافات غير متساوية بين الكلمات","تقطيع الكلمة الواحدة"],"words":["هلال","لا","صلاة","مدرسة","سماء"],"s":"وطني أمانة في عنقي وأعتز بهويتي","days":["الاثنين","الثلاثاء","الأربعاء"],"from":"2026-12-14","to":"2026-12-16"},{"n":7,"k":"post","t":"القياس البعدي والمعرض","d":"الخميس 8/7/1448هـ","dg":"17/12/2026م","note":"يوم الخميس 8/7/1448هـ، الموافق اليوم العالمي للغة العربية: يكتب الطالب النص الموحد نفسه ويُقيَّم بالبطاقة نفسها، ويُقام معرض «قلمي هويتي» لعرض كتابة كل طالب قبل التدريب وبعده.","days":[],"s":null,"from":"2026-12-17","to":"2026-12-17"}],"std":"نصٌّ حكيمٌ له سِرٌّ قاطعٌ وذو شأنٍ عظيمٍ، مكتوبٌ على ثوبٍ أخضرَ، ومُغلَّفٌ بجلدٍ أزرق.","crit":["وضوح أشكال الحروف","الالتزام بالسطر","تناسب أحجام الحروف","المسافات بين الحروف والكلمات","النظافة والتنظيم"],"general":["اجلس معتدلًا، وضع الورقة مائلة قليلًا أمامك.","أمسك القلم بين الإبهام والسبابة، واسنده على الوسطى، دون ضغط شديد.","استخدم قلم رصاص أو حبر ناعم وورقة مسطرة.","تدرّب 10 دقائق يوميًا؛ القليل المستمر أنفع من الكثير المتقطع.","اكتب ببطء أولًا، ثم زد سرعتك مع الإتقان."]};

function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function curWeek(){const t=today();if(t<D.weeks[0].from)return -1;const w=D.weeks.find(x=>x.k==="w"&&x.from<=t&&t<=x.to);if(w)return w.n;return t>D.weeks[6].to?7:-1}

function home(){const cw=curWeek();
  render(`<section class="sheet hero"><span class="tag">تدريب منزلي · المرحلة المتوسطة</span><h1>قلمي هويتي</h1><p>برنامج لتحسين خطك بخط الرقعة في ثلاثة أسابيع: ستة تدريبات، في كل تدريب عائلة من الحروف تتدرب عليها في البيت 10 دقائق يوميًا لمدة ثلاثة أيام، وتسجّل تدريبك هنا وفي بطاقتك الورقية.</p>${cw===-1?`<p class="note">يبدأ البرنامج الأحد 19/6/1448هـ (29 نوفمبر 2026م)، وينتهي الخميس 8/7/1448هـ في اليوم العالمي للغة العربية.</p>`:""}</section>

  <section class="sheet"><h3 style="font-size:17px">قبل أن تبدأ</h3><ul class="list">${D.general.map(t=>`<li>${t}</li>`).join("")}</ul></section>`);

  if(w.k!=="w"){render(`<section class="sheet hero"><span class="tag">${w.k==="pre"?"بداية البرنامج":"ختام البرنامج"}</span><h1 style="font-size:40px">${w.t}</h1><p>${w.d} (${w.dg})</p></section><section class="sheet"><p style="margin:0">${w.note}</p><h3 style="font-size:16px">النص الموحد</h3><p class="model" style="font-size:28px">${D.std}</p><p class="note">${w.k==="post"?"تدرّب على كتابة هذا النص في البيت قبل موعد القياس البعدي.":"هذا هو النص الذي ستكتبه في القياس القبلي والبعدي."}</p></section>`,true);return}

  <section class="sheet"><h3 style="font-size:17px">تدرّب بإصبعك</h3><p class="note">اختر حرفًا أو كلمة، ثم مرّر إصبعك فوق الشكل الباهت لتتعلم اتجاه الكتابة.</p><div class="chips" id="chs">${[...w.L,...w.words.slice(0,3)].map((t,i)=>`<button type="button" class="chip" data-t="${t}" aria-pressed="${i===0}">${t}</button>`).join("")}</div>
   <div class="pad"><canvas id="cv" aria-label="لوحة التتبع"></canvas></div><div class="padbar"><button class="btn ghost" id="clr" type="button">امسح</button></div></section>
  <section class="sheet"><h3 style="font-size:17px">سجل تدريبي في البيت</h3><p class="note">اضغط على اليوم الذي تدربت فيه 10 دقائق. الهدف الأيام الثلاثة كلها، ولا تنس توقيع ولي أمرك في البطاقة الورقية.</p>
   <div class="days" style="grid-template-columns:repeat(3,minmax(0,1fr))">${w.days.map((d,i)=>`<button type="button" data-d="${i}" aria-pressed="${!!log[i]}"><b>${log[i]?"✓":"·"}</b>${d}</button>`).join("")}</div><div class="meter"><i style="width:${Math.min(100,dn/3*100)}%"></i></div>
