<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>مبادرة درب وطن للمرحلة المتوسطة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone game; a vertical "trail" map of seven stations, full-screen question cards. */
:root{
  --bg:#EEF3EF; --surface:#FFFFFF; --sunk:#E1E9E3; --line:#CCD9D0; --fg:#14281F; --muted:#56695E;
  --green:#0D6B4C; --green-2:#0A5A40; --gold:#B7862A; --gold-soft:#F6EBD3; --ok:#1C7C45; --ok-soft:#DDF1E5; --bad:#B42323; --bad-soft:#FBE5E5;
  --on:#FFFFFF; --shadow:0 10px 26px rgba(13,60,40,.14);
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif; --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1612;--surface:#13221C;--sunk:#1B2E26;--line:#28423A;--fg:#E5EEE9;--muted:#9AB0A4;--green:#4CC191;--green-2:#3AA87C;--gold:#E2B456;--gold-soft:#33291A;--ok:#62D291;--ok-soft:#11301F;--bad:#F28585;--bad-soft:#381A1A;--on:#08130E;--shadow:0 10px 26px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1612;--surface:#13221C;--sunk:#1B2E26;--line:#28423A;--fg:#E5EEE9;--muted:#9AB0A4;--green:#4CC191;--green-2:#3AA87C;--gold:#E2B456;--gold-soft:#33291A;--ok:#62D291;--ok-soft:#11301F;--bad:#F28585;--bad-soft:#381A1A;--on:#08130E;--shadow:0 10px 26px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;direction:rtl;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--green)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:700}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;display:flex;flex-direction:column;gap:16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--green);color:#fff;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.top b{font-family:var(--display);font-size:20px;flex:1}
.pts{background:rgba(255,255,255,.16);border-radius:99px;padding:3px 12px;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero{text-align:center;align-items:center;padding-block:26px 20px}
.hero h1{font-size:40px;color:var(--green);line-height:1.2}
.hero p{margin:0;color:var(--muted)}
.emb{width:84px;height:84px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#fff;font-size:40px;box-shadow:var(--shadow)}
label{font-weight:600;font-size:14px;color:var(--muted)}
.f{display:flex;flex-direction:column;gap:6px}
input,select{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;min-height:50px;font-size:16px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:50px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on)}
.btn{border:0;border-radius:14px;min-height:54px;padding:12px 18px;font-weight:700;font-size:17px;cursor:pointer;background:var(--green);color:var(--on);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.gold{background:var(--gold);color:#1d1406}
.btn.ghost{background:var(--sunk);color:var(--fg)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.err{color:var(--bad);font-size:14px;margin:0}
.note{font-size:13px;color:var(--muted);margin:0}
/* trail map */
.trail{position:relative;display:flex;flex-direction:column;gap:14px;padding:6px 0}
.trail::before{content:"";position:absolute;top:30px;bottom:30px;right:37px;width:4px;background:repeating-linear-gradient(to bottom,var(--gold) 0 10px,transparent 10px 18px);border-radius:4px}
.stn{position:relative;display:flex;align-items:center;gap:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;cursor:pointer;text-align:right;width:100%}
.stn .ic{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:22px;background:var(--sunk);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line);z-index:1}
.stn .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.stn .tx b{font-family:var(--display);font-size:17px}
.stn .tx small{color:var(--muted);font-size:13px}
.stn .st{font-size:13px;font-weight:700;flex:none;text-align:center;min-width:52px}
.stn.done{border-color:var(--ok)}.stn.done .ic{background:var(--ok-soft);box-shadow:0 0 0 2px var(--ok)}
.stn.next{border-color:var(--gold);box-shadow:var(--shadow)}.stn.next .ic{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold)}
.stn[disabled]{opacity:.55;cursor:not-allowed}
.stars{color:var(--gold);letter-spacing:1px}
.prog{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}.prog i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
/* question */
.qh{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600}
.timer{font-variant-numeric:tabular-nums}
.q{font-size:19px;font-weight:700;line-height:1.55}
.tag{align-self:flex-start;font-size:12px;font-weight:700;background:var(--gold-soft);color:var(--gold);border-radius:99px;padding:2px 10px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;min-height:56px;text-align:right;font-weight:600;cursor:pointer;font-size:16px}
.opt:hover{border-color:var(--green)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{border-radius:14px;padding:12px 14px;font-size:15px}.fb.ok{background:var(--ok-soft)}.fb.no{background:var(--bad-soft)}
.fb b{display:block;font-family:var(--display);font-size:17px}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.badge{display:flex;flex-direction:column;align-items:center;gap:2px;width:74px;font-size:11px;text-align:center;color:var(--muted)}
.badge span{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--sunk);filter:grayscale(1);opacity:.5}
.badge.on span{background:var(--gold-soft);filter:none;opacity:1;box-shadow:0 0 0 2px var(--gold)}
.cert{border:3px double var(--gold);text-align:center;align-items:center;background:linear-gradient(var(--surface),var(--surface)) padding-box}
.cert h2{color:var(--green);font-size:26px}
.big{font-family:var(--display);font-size:44px;color:var(--green);line-height:1;font-variant-numeric:tabular-nums}
.cmp{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%}
.cmp div{background:var(--sunk);border-radius:12px;padding:8px;text-align:center}.cmp small{display:block;color:var(--muted);font-size:12px}.cmp b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.code{direction:ltr;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--sunk);border-radius:10px;padding:10px;word-break:break-all;user-select:all}
.pop{animation:pop .5s ease}@keyframes pop{0%{transform:scale(.9);opacity:.4}60%{transform:scale(1.04)}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.imq{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0;min-width:0}
.imq legend{font-weight:700;padding:0 4px;font-size:15px;line-height:1.6}
.imq legend span{color:var(--muted);margin-inline-end:6px}
.imo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.imo button{font:inherit;font-size:13px;padding:10px 2px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:inherit;cursor:pointer}
.imo button[data-v="3"][aria-pressed="true"]{background:#1F8A4C;border-color:#1F8A4C;color:#fff;font-weight:700}
.imo button[data-v="2"][aria-pressed="true"]{background:#C98A12;border-color:#C98A12;color:#fff;font-weight:700}
.imo button[data-v="1"][aria-pressed="true"]{background:#C0392B;border-color:#C0392B;color:#fff;font-weight:700}
.iml{display:block;font-weight:600;font-size:14px}.iml textarea,.iml input,.iml select{width:100%;box-sizing:border-box;margin-top:4px;font:inherit;font-weight:400;border:1px solid var(--line);border-radius:10px;padding:9px;background:transparent;color:inherit}
.btn:disabled{opacity:.45;cursor:not-allowed}
.as{border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;background:var(--sunk);line-height:1.6}.as.ok{background:#1F8A4C;color:#fff}.as.off{font-weight:600;color:var(--muted)}</style>

<script>
const D={"st":[{"id":"hw","t":"الهوية والرموز","ic":"🏳","d":"العلم، والشعار، والنشيد، والمناسبات الوطنية","m":[{"q":"ما المعنى الذي يرمز إليه السيف في العلم السعودي؟","o":["القوة والعدل","الحرب والقتال","الزينة فقط"],"a":0,"e":"السيف في العلم يرمز إلى القوة والعدل وحماية الوطن."},{"q":"بدأ عزف السلام الملكي في الطابور وأنت تتحدث مع زميلك. ماذا تفعل؟","o":["أكمل حديثي بصوت منخفض","أتوقف وأقف باحترام حتى ينتهي","أجلس حتى ينتهي"],"a":1,"e":"احترام السلام الملكي يكون بالوقوف والصمت حتى انتهائه."},{"q":"«العلم السعودي لا يُنكّس أبدًا لأنه يحمل كلمة التوحيد». صح أم خطأ؟","o":["صح","خطأ"],"a":0,"e":"لا يُنكّس العلم السعودي احترامًا لشهادة التوحيد المكتوبة عليه."},{"q":"يوافق اليوم الوطني للمملكة العربية السعودية:","o":["22 فبراير","23 سبتمبر","2 أبريل"],"a":1,"e":"اليوم الوطني في 23 سبتمبر ذكرى توحيد المملكة عام 1932م، أما 22 فبراير فهو يوم التأسيس."}]},{"id":"hq","t":"الحقوق والواجبات","ic":"⚖","d":"ما لي وما عليّ في المدرسة والمجتمع","m":[{"q":"من حقك في المدرسة أن تتعلم في بيئة آمنة. ما الواجب الذي يقابل هذا الحق؟","o":["أن أحترم زملائي ولا أوذيهم","أن أحضر متى شئت","أن أختار معلمي"],"a":0,"e":"كل حق يقابله واجب: حقي في الأمان يقابله واجبي في عدم إيذاء غيري."},{"q":"تأخرت في تسليم واجبك ووجّهك المعلم. ما التصرف الصحيح؟","o":["أجادل المعلم أمام الطلاب","أعتذر وألتزم بالتسليم في المرة القادمة","ألقي اللوم على زميلي"],"a":1,"e":"تحمّل المسؤولية والاعتذار من واجبات الطالب."},{"q":"«الالتزام بالأنظمة يحمي حقوقي وحقوق الآخرين». صح أم خطأ؟","o":["صح","خطأ"],"a":0,"e":"الأنظمة وُضعت لتنظيم الحقوق وحمايتها للجميع."},{"q":"رأيت زميلًا يتعرض للتنمر في الفسحة. ما واجبك؟","o":["أضحك مع الآخرين","أبتعد وكأنني لم أر شيئًا","أطلب المساعدة من المعلم المناوب أو الموجه"],"a":2,"e":"إبلاغ الكبار عن التنمر واجب يحمي زميلك ويوقف الأذى."}]},{"id":"mr","t":"المرافق العامة","ic":"🏛","d":"المحافظة على الممتلكات والبيئة والنظافة","m":[{"q":"وجدت صنبور المياه في دورة المياه مفتوحًا. ماذا تفعل؟","o":["أتركه فليس مسؤوليتي","أغلقه، وأبلغ إن كان معطلًا","ألعب بالماء قليلًا"],"a":1,"e":"المحافظة على ال }

const IM_Q=["حققت المبادرة الأهداف التي عرفتها في بدايتها","اكتسبت منها معارف ومهارات جديدة","زادت حماسي ورغبتي في المشاركة والتعلم","غيّرت شيئًا إيجابيًا في سلوكي أو ممارستي اليومية","أنا راضٍ عن المبادرة بشكل عام","كانت أنشطتها مناسبة ومحتواها واضحًا","سأستمر في تطبيق ما تعلمته، وأتمنى تطوير المبادرة"];
const IM_O=[[3,"بدرجة مرتفعة"],[2,"بدرجة متوسطة"],[1,"بدرجة منخفضة"]];
function imSurvey(put,card,onDone){const A=(Array.isArray(S.im)&&S.im.length===7?S.im:[0,0,0,0,0,0,0]).slice();let ib=S.ib||"",ii=S.ii||"";
  const draw=()=>{const n=A.filter(Boolean).length;put(`<section class="${card}"><h2 style="font-size:22px;margin:0">قياس أثر المبادرة</h2><p class="note">قبل إرسال نتيجتك: إلى أي درجة تنطبق كل عبارة عليك؟ إجابتك الصادقة تساعدنا على تطوير المبادرة، ولا تؤثر في نتيجتك.</p>
  ${IM_Q.map((q,k)=>`<fieldset class="imq"><legend><span>${k+1}</span>${q}</legend><div class="imo">${IM_O.map(([v,t])=>`<button type="button" data-k="${k}" data-v="${v}" aria-pressed="${A[k]===v}">${t}</button>`).join("")}</div></fieldset>`).join("")}
  <label class="iml">أكثر ما أعجبني في المبادرة (اختياري)<textarea id="imb" maxlength="200" rows="2">${esc(ib)}</textarea></label>
  <label class="iml">اقتراحي لتحسينها (اختياري)<textarea id="imi" maxlength="200" rows="2">${esc(ii)}</textarea></label>
  <p class="note" role="status">أجبت عن ${n} من 7 عبارات</p><button class="btn" id="imok" type="button" ${n===7?"":"disabled"}>حفظ والمتابعة إلى الإرسال</button></section>`);
    document.querySelectorAll(".imo button").forEach(b=>b.onclick=()=>{A[+b.dataset.k]=+b.dataset.v;ib=document.getElementById("imb").value;ii=document.getElementById("imi").value;const y=window.scrollY;draw();window.scrollTo(0,y)});
    document.getElementById("imok").onclick=()=>{S.im=A;S.ib=document.getElementById("imb").value.trim().slice(0,200);S.ii=document.getElementById("imi").value.trim().slice(0,200);save();onDone()}};
  draw();window.scrollTo(0,0)}
/* ---------- الإرسال المباشر إلى جدول رائد النشاط ---------- */
const SEND_URL="https://script.google.com/macros/s/AKfycbzfmBUcACJSe_ehcPxWdLVccv805RzSAdgJQTHv9E7ALR3ZC9z2nHLTBz5WKexHYDKz/exec";
function autoSend(ini,m,code){const el=document.getElementById("as");if(!el) return;
  const ok=()=>{el.className="as ok";el.textContent="✓ وصلت نتيجتك إلى رائد النشاط مباشرة، ولا تحتاج إلى إرسالها عبر واتساب.";const w=document.getElementById("wan");if(w) w.textContent="إرسال نسخة عبر واتساب اختياري، للاحتياط فقط."};
  if(!SEND_URL||!window.fetch){el.className="as off";el.textContent="أرسل نتيجتك عبر واتساب من الزر التالي.";return}
  if(S.sent===code) return ok();
  el.className="as";el.textContent="جارٍ إرسال نتيجتك إلى رائد النشاط…";
  fetch(SEND_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({ini,n:m.n||"",g:m.g||"",c:m.c||"",code})})
   .then(()=>{S.sent=code;save();ok()}).catch(()=>{el.className="as off";el.textContent="تعذّر الإرسال المباشر الآن. أرسل نتيجتك عبر واتساب من الزر التالي."})}
/* ---------- result code ---------- */
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h.toString(36).toUpperCase().padStart(6,"0").slice(-6)}
function makeCode(){const p={n:S.name,s:S.stage,g:S.grade,c:S.cls,pre:S.pre,post:S.post,st:D.st.map(s=>S.st[s.id]?S.st[s.id].c:-1),pts:S.pts,im:S.im||null,ib:S.ib||"",ii:S.ii||"",t:Date.now()};
  const b=btoa(unescape(encodeURIComponent(JSON.stringify(p)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");return "WT1."+b+"."+hash(SALT+b)}
function sendView(final){
  const code=makeCode();const pre=sum(S.pre),post=sum(S.post);
  const msg=`درب وطن — ${final?"النتيجة النهائية":"تقدم الطالب"}\nالاسم: ${S.name}\nالصف: ${S.grade} · الفصل ${S.cls}\nاختبار البداية: ${pre}/7${post!=null?`\nالتحدي الختامي: ${post}/7`:""}\nالمحطات المنجزة: ${doneCount()}/7 · النقاط: ${S.pts}${S.im?"\nقياس الأثر: تم":""}\n\n${code}`;
  app.innerHTML=topBar()+`<section class="card pop"><h2 style="font-size:22px">إرسال ${final?"النتيجة":"التقدم"}</h2><div class="as" id="as" role="status"></div><p class="note" id="wan">إن لم يظهر تأكيد الوصول، اضغط زر واتساب فتفتح محادثة رائد النشاط مباشرة، ثم أرسل الرسالة كما هي دون تعديل؛ فالرمز في آخرها يحمل نتيجتك.</p>
  <a class="btn" id="wa" href="https://wa.me/966535597468?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">فتح واتساب وإرسال الرسالة</a>
  <button class="btn ghost" id="cp" type="button">نسخ الرسالة</button><p class="note" id="cpm" role="status"></p>
  <details><summary class="note" style="cursor:pointer">عرض الرسالة</summary><pre class="code" id="msg" style="white-space:pre-wrap;direction:rtl;font-family:var(--body)">${esc(msg)}</pre></details>
  <button class="btn ghost" id="bk" type="button">رجوع</button></section>`;
  $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(msg);$("#cpm").textContent="نُسخت الرسالة. الصقها في محادثة رائد النشاط وأرسلها."}catch(e){const r=document.createRange();r.selectNodeContents($("#msg"));$("details").open=true;const sel=getSelection();sel.removeAllRanges();sel.addRange(r);$("#cpm").textContent="حدّد النص الظاهر وانسخه يدويًا."}};
  $("#bk").onclick=home;autoSend("watan",{n:S.name,g:S.grade,c:S.cls},code);
}
home();
</script>
