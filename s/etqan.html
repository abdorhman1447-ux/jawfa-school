<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>قياس أثر المبادرات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Reem+Kufi:wght@600;700&display=swap">
<style>
:root{--bg:#F3F1EA;--surface:#FFFFFF;--fg:#1B2A36;--muted:#5D6B76;--line:#DCD8CC;--sunk:#ECE9E0;--ink:#1D4E6B;--on:#fff;--acc:#B5832A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181D;--surface:#1A2229;--fg:#E8ECEF;--muted:#9AA7B1;--line:#2E3A43;--sunk:#222C34;--ink:#5FA3C9;--on:#0E1418;--acc:#D9A64A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12181D;--surface:#1A2229;--fg:#E8ECEF;--muted:#9AA7B1;--line:#2E3A43;--sunk:#222C34;--ink:#5FA3C9;--on:#0E1418;--acc:#D9A64A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:16px;line-height:1.6;direction:rtl}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;font-family:"Reem Kufi",serif;color:var(--ink);font-size:18px}
.top small{font-family:inherit;color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero{border-top:5px solid var(--acc)}
.hero h1{font-family:"Reem Kufi",serif;font-size:28px;line-height:1.3;margin:0;color:var(--ink);text-wrap:balance}
.tag{align-self:flex-start;background:var(--sunk);border-radius:99px;padding:2px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}
p{margin:0}
.btn{border:0;border-radius:14px;min-height:52px;padding:12px 18px;font:inherit;font-weight:700;font-size:17px;cursor:pointer;background:var(--ink);color:var(--on);display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
.btn.ghost{background:var(--sunk);color:var(--fg)}
.btn:focus-visible,.imo button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.imq{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0;min-width:0}
.imq legend{font-weight:700;padding:0 4px;font-size:15px;line-height:1.6}
.imq legend span{color:var(--muted);margin-inline-end:6px}
.imo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.imo button{font:inherit;font-size:13px;padding:10px 2px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:inherit;cursor:pointer}
.imo button[data-v="3"][aria-pressed="true"]{background:#1F8A4C;border-color:#1F8A4C;color:#fff;font-weight:700}
.imo button[data-v="2"][aria-pressed="true"]{background:#C98A12;border-color:#C98A12;color:#fff;font-weight:700}
.imo button[data-v="1"][aria-pressed="true"]{background:#C0392B;border-color:#C0392B;color:#fff;font-weight:700}
.iml{display:block;font-weight:600;font-size:14px}.iml textarea,.iml input,.iml select{width:100%;box-sizing:border-box;margin-top:4px;font:inherit;font-weight:400;border:1px solid var(--line);border-radius:10px;padding:9px;background:transparent;color:inherit}
.btn:disabled{opacity:.45;cursor:not-allowed}
.as{border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;background:var(--sunk);line-height:1.6}.as.ok{background:#1F8A4C;color:#fff}.as.off{font-weight:600;color:var(--muted)}</style>
<div class="wrap" id="app"></div>
<script>
const CFG={etqan:{t:"مبادرة إتقان للمرحلة الثانوية",tag:"اللغة الإنجليزية · المرحلة الثانوية",d:"أنهيت مبادرة إتقان؟ قيّم أثرها عليك في دقيقتين، ثم أرسل تقييمك إلى رائد النشاط.",g:["الأول الثانوي","الثاني الثانوي","الثالث الثانوي"],c:["1","2","3"]}};
const INI=CFG[location.hash.slice(1)]?location.hash.slice(1):"etqan",C=CFG[INI];
const LS="impact-"+INI;let S={};try{S=JSON.parse(localStorage.getItem(LS)||"{}")||{}}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TOPH=`<header class="top"><span>قياس أثر المبادرة</span><small>متوسطة وثانوية الجوفاء</small></header>`;
function put(h){app.innerHTML=TOPH+h}
/* ---------- قياس أثر المبادرة ---------- */
const IM_Q=["حققت المبادرة الأهداف التي عرفتها في بدايتها","اكتسبت منها معارف ومهارات جديدة","زادت حماسي ورغبتي في المشاركة والتعلم","غيّرت شيئًا إيجابيًا في سلوكي أو ممارستي اليومية","أنا راضٍ عن المبادرة بشكل عام","كانت أنشطتها مناسبة ومحتواها واضحًا","سأستمر في تطبيق ما تعلمته، وأتمنى تطوير المبادرة"];
const IM_O=[[3,"بدرجة مرتفعة"],[2,"بدرجة متوسطة"],[1,"بدرجة منخفضة"]];
function imSurvey(put,card,onDone){const A=(Array.isArray(S.im)&&S.im.length===7?S.im:[0,0,0,0,0,0,0]).slice();let ib=S.ib||"",ii=S.ii||"";
  const draw=()=>{const n=A.filter(Boolean).length;put(`<section class="${card}"><h2 style="font-size:22px;margin:0">قياس أثر المبادرة</h2><p class="note">قبل إرسال نتيجتك: إلى أي درجة تنطبق كل عبارة عليك؟ إجابتك الصادقة تساعدنا على تطوير المبادرة، ولا تؤثر في نتيجتك.</p>
  ${IM_Q.map((q,k)=>`<fieldset class="imq"><legend><span>${k+1}</span>${q}</legend><div class="imo">${IM_O.map(([v,t])=>`<button type="button" data-k="${k}" data-v="${v}" aria-pressed="${A[k]===v}">${t}</button>`).join("")}</div></fieldset>`).join("")}
  <label class="iml">أكثر ما أعجبني في المبادرة (اختياري)<textarea id="imb" maxlength="200" rows="2">${esc(ib)}</textarea></label>
  <label class="iml">اقتراحي لتحسينها (اختياري)<textarea id="imi" maxlength="200" rows="2">${esc(ii)}</textarea></label>
  <p class="note" role="status">أجبت عن ${n} من 7 عبارات</p><button class="btn" id="imok" type="button" ${n===7?"":"disabled"}>حفظ والمتابعة إلى الإرسال</button></section>`);
    document.querySelectorAll(".imo button").forEach(b=>b.onclick=()=>{A[+b.dataset.k]=+b.dataset.v;ib=document.getElementById("imb").value;ii=document.getElementById("imi").value;const y=window.scrollY;draw();window.scrollTo(0,y)});
    document.getElementById("imok").onclick=()=>{S.im=A;S.ib=document.getElementById("imb").value.trim().slice(0,200);S.ii=document.getElementById("imi").value.trim().slice(0,200);save();onDone()}};
  draw();window.scrollTo(0,0)}

/* ---------- الإرسال المباشر إلى جدول رائد النشاط ---------- */
const SEND_URL="https://script.google.com/macros/s/AKfycbzfmBUcACJSe_ehcPxWdLVccv805RzSAdgJQTHv9E7ALR3ZC9z2nHLTBz5WKexHYDKz/exec";
function autoSend(ini,m,code){const el=document.getElementById("as");if(!el) return;
  const ok=()=>{el.className="as ok";el.textContent="✓ وصلت نتيجتك إلى رائد النشاط مباشرة، ولا تحتاج إلى إرسالها عبر واتساب.";const w=document.getElementById("wan");if(w) w.textContent="إرسال نسخة عبر واتساب اختياري، للاحتياط فقط."};
  if(!SEND_URL||!window.fetch){el.className="as off";el.textContent="أرسل نتيجتك عبر واتساب من الزر التالي.";return}
  if(S.sent===code) return ok();
  el.className="as";el.textContent="جارٍ إرسال نتيجتك إلى رائد النشاط…";
  fetch(SEND_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({ini,n:m.n||"",g:m.g||"",c:m.c||"",code})})
   .then(()=>{S.sent=code;save();ok()}).catch(()=>{el.className="as off";el.textContent="تعذّر الإرسال المباشر الآن. أرسل نتيجتك عبر واتساب من الزر التالي."})}
const SALT="jwf1448im";
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h.toString(36).toUpperCase().padStart(6,"0").slice(-6)}
function home(){put(`<section class="card hero"><span class="tag">${C.tag}</span><h1>${C.t}</h1><p>${C.d}</p></section>
  <section class="card"><h2 style="font-size:20px;margin:0">بياناتك</h2><p class="note">اكتب اسمك الثلاثي كما في سجلات المدرسة، ثم اختر صفك وفصلك.</p>
  <label class="iml">الاسم الثلاثي<input id="rn" maxlength="60" value="${esc(S.name||"")}" autocomplete="name"></label>
  <label class="iml">الصف<select id="rg">${C.g.map(g=>`<option${S.grade===g?" selected":""}>${g}</option>`).join("")}</select></label>
  <label class="iml">الفصل<select id="rc">${C.c.map(c=>`<option${S.cls===c?" selected":""}>${c}</option>`).join("")}</select></label>
  <p class="note" id="rm" role="status"></p><button class="btn" id="rok" type="button">التالي: قياس الأثر</button></section>`);
  $("#rok").onclick=()=>{const n=$("#rn").value.trim().replace(/\s+/g," ");if(n.split(" ").length<3){$("#rm").textContent="اكتب اسمك الثلاثي.";return}S.name=n;S.grade=$("#rg").value;S.cls=$("#rc").value;save();imSurvey(put,"card",send)}}
function send(){const p={i:INI,n:S.name,g:S.grade,c:S.cls,im:S.im,ib:S.ib||"",ii:S.ii||"",t:Date.now()};
  const b=btoa(unescape(encodeURIComponent(JSON.stringify(p)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");const code="IM1."+b+"."+hash(SALT+b);
  const msg=`قياس أثر ${C.t}\nالاسم: ${S.name}\nالصف: ${S.grade} · الفصل ${S.cls}\n\n${code}`;
  put(`<section class="card"><h2 style="font-size:22px;margin:0">شكرًا لك! أرسل تقييمك</h2><div class="as" id="as" role="status"></div><p class="note" id="wan">إن لم يظهر تأكيد الوصول، اضغط زر واتساب فتفتح محادثة رائد النشاط مباشرة، ثم أرسل الرسالة كما هي دون تعديل؛ فالرمز في آخرها يحمل تقييمك.</p>
  <a class="btn" href="https://wa.me/966535597468?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">فتح واتساب وإرسال الرسالة</a><button class="btn ghost" id="cp" type="button">نسخ الرسالة</button><p class="note" id="cpm" role="status"></p>
  <details><summary class="note" style="cursor:pointer">عرض الرسالة</summary><pre id="msg" style="white-space:pre-wrap;word-break:break-all;font-family:inherit;font-size:12px;background:var(--sunk);border-radius:10px;padding:10px">${esc(msg)}</pre></details>
  <button class="btn ghost" id="ed" type="button">تعديل تقييمي</button></section>`);
  $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(msg);$("#cpm").textContent="نُسخت الرسالة. الصقها في محادثة رائد النشاط وأرسلها."}catch(e){$("details").open=true;const r=document.createRange();r.selectNodeContents($("#msg"));const g=getSelection();g.removeAllRanges();g.addRange(r);$("#cpm").textContent="حدّد النص الظاهر وانسخه يدويًا."}};
  $("#ed").onclick=()=>imSurvey(put,"card",send);autoSend(INI,{n:S.name,g:S.grade,c:S.cls},code)}
S.im&&S.name?send():home();
</script>

</body></html>
