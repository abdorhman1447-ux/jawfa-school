<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>اعرف مسارك للصف الأول الثانوي</title>

<style>
/* Layout: one-column phone flow; a three-step hub (discover, know yourself, try) leading to a fit chart across the five tracks. */
:root{
  --bg:#F1F3F8; --surface:#FFFFFF; --sunk:#E4E8F1; --line:#CFD6E4; --fg:#16203A; --muted:#58637B;
  --ink:#1D2E5C; --amber:#D08A1E; --amber-soft:#FBEFD9; --ok:#1C7C45; --ok-soft:#DDF1E5; --bad:#B42323; --bad-soft:#FBE5E5; --on:#FFFFFF;
  --shadow:0 10px 26px rgba(22,32,58,.13);
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif; --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0C1222;--surface:#151D33;--sunk:#1E2842;--line:#2C3756;--fg:#E6EAF4;--muted:#9CA6BF;--ink:#9DB4F0;--amber:#F0B45A;--amber-soft:#33281A;--ok:#62D291;--ok-soft:#11301F;--bad:#F28585;--bad-soft:#381A1A;--on:#0C1222;--shadow:0 10px 26px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1222;--surface:#151D33;--sunk:#1E2842;--line:#2C3756;--fg:#E6EAF4;--muted:#9CA6BF;--ink:#9DB4F0;--amber:#F0B45A;--amber-soft:#33281A;--ok:#62D291;--ok-soft:#11301F;--bad:#F28585;--bad-soft:#381A1A;--on:#0C1222;--shadow:0 10px 26px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;direction:rtl;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.brand{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));background:var(--surface);border-bottom:3px solid var(--amber);margin-bottom:-16px}
.brand img{width:118px;height:auto;display:block}
.brand span{font-family:var(--display);font-weight:700;font-size:18px;color:var(--ink);line-height:1.4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand img{filter:brightness(0) invert(1) opacity(.82)}}
:root[data-theme="dark"] .brand img{filter:brightness(0) invert(1) opacity(.82)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:700}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;display:flex;flex-direction:column;gap:16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#1D2E5C;color:#fff;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.top b{font-family:var(--display);font-size:18px;flex:1}
.top button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero{text-align:center;align-items:center;padding-block:24px 20px}
.hero h1{font-size:34px;color:var(--ink);line-height:1.25}
.hero p{margin:0;color:var(--muted)}
.fan{display:flex;gap:6px;justify-content:center}
.fan span{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--sunk)}
label{font-weight:600;font-size:14px;color:var(--muted)}
.f{display:flex;flex-direction:column;gap:6px}
input[type=text]{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;min-height:50px;font-size:16px;width:100%}
.btn{border:0;border-radius:14px;min-height:54px;padding:12px 18px;font-weight:700;font-size:17px;cursor:pointer;background:var(--ink);color:var(--on);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;width:100%}
.btn:active{transform:scale(.98)}
.btn.amber{background:var(--amber);color:#1d1406}.btn.ghost{background:var(--sunk);color:var(--fg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.err{color:var(--bad);font-size:14px;margin:0}.note{font-size:13px;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:46px;font-weight:600;cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:50px;font-weight:700;cursor:pointer;font-family:var(--display);font-size:18px}
.scale button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#1d1406}
.scale-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.prog{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}.prog i{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width .25s}
.qh{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600}
.q{font-size:19px;font-weight:700;line-height:1.55;margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;min-height:56px;text-align:right;font-weight:600;cursor:pointer;font-size:16px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:14px;padding:12px 14px;font-size:15px}.fb.ok{background:var(--ok-soft)}.fb.no{background:var(--bad-soft)}.fb b{display:block;font-family:var(--display)}
.likert{display:flex;flex-direction:column;gap:8px}
.likert button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:right;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px}
.likert button i{width:26px;height:26px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:13px;flex:none}
.likert button:hover{border-color:var(--ink)}
/* hub */
.step{display:flex;align-items:center;gap:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;text-align:right;width:100%}
.step .n{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--sunk);font-size:18px}
.step .tx{flex:1;min-width:0;display:flex;flex-direction:column}.step .tx b{font-family:var(--display);font-size:17px}.step .tx small{color:var(--muted);font-size:13px}
.step.done{border-color:var(--ok)}.step.done .n{background:var(--ok);color:#fff}
.step .go{font-size:13px;font-weight:700;color:var(--amber)}
/* path cards */
.pc{border:1.5px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.pc summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.pc summary::-webkit-details-marker{display:none}
.pc .pi{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none;background:color-mix(in srgb,var(--pc) 16%,transparent)}
.pc summary b{font-family:var(--display);font-size:17px;color:var(--pc);flex:1}
.pc summary::after{content:"＋";color:var(--muted);font-size:20px}.pc[open] summary::after{content:"－"}
.pc .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.pc .body p{margin:0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--bg);border-radius:12px;padding:10px}.kv h4{margin:0 0 4px;font-size:13px;color:var(--muted)}.kv ul{margin:0;padding-inline-start:16px;font-size:14px}
@media (max-width:380px){.kv{grid-template-columns:1fr}}
/* result */
.fit{display:flex;flex-direction:column;gap:10px}
.fr{display:grid;grid-template-columns:120px 1fr 46px;gap:8px;align-items:center;font-size:14px;font-weight:600}
.fr .bar{height:14px;border-radius:99px;background:var(--sunk);overflow:hidden}.fr .bar i{display:block;height:100%;border-radius:99px;background:var(--pc)}
.fr .v{font-family:var(--display);text-align:left;font-variant-numeric:tabular-nums}
.best{border:2px solid var(--pc);background:color-mix(in srgb,var(--pc) 8%,var(--surface))}
.best h2{color:var(--pc);font-size:24px}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cmp div{background:var(--sunk);border-radius:12px;padding:8px;text-align:center}.cmp small{display:block;color:var(--muted);font-size:12px}.cmp b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.chk{display:flex;flex-direction:column;gap:8px}
.chk label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--fg);font-weight:600;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--amber);flex:none}
.warn{background:var(--amber-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.pop{animation:pop .45s ease}@keyframes pop{0%{transform:translateY(8px);opacity:.3}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.imq{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0;min-width:0}
.imq legend{font-weight:700;padding:0 4px;font-size:15px;line-height:1.6}
.imq legend span{color:var(--muted);margin-inline-end:6px}
.imo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.imo button{font:inherit;font-size:13px;padding:10px 2px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:inherit;cursor:pointer}
.imo button[data-v="3"][aria-pressed="true"]{background:#1F8A4C;border-color:#1F8A4C;color:#fff;font-weight:700}
.imo button[data-v="2"][aria-pressed="true"]{background:#C98A12;border-color:#C98A12;color:#fff;font-weight:700}
.imo button[data-v="1"][aria-pressed="true"]{background:#C0392B;border-color:#C0392B;color:#fff;font-weight:700}
.iml{display:block;font-weight:600;font-size:14px}.iml textarea,.iml input,.iml select{width:100%;box-sizing:border-box;margin-top:4px;font:inherit;font-weight:400;border:1px solid var(--line);border-radius:10px;padding:9px;background:transparent;color:inherit}
.btn:disabled{opacity:.45;cursor:not-allowed}
.as{border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;background:var(--sunk);line-height:1.6}.as.ok{background:#1F8A4C;color:#fff}.as.off{font-weight:600;color:var(--muted)}</style>

function home(){if(!S.name)return register();if(!S.pre)return startQ("pre");if(S.post)return result();return hub()}
function register(err){
  render(`<section class="card hero pop"><div class="fan" aria-hidden="true">${D.paths.map(p=>`<span>${p.ic}</span>`).join("")}</div><h1>اعرف مسارك</h1><p style="font-weight:700;color:var(--amber)">للصف الأول الثانوي</p><p>بعد السنة الأولى المشتركة تختار واحدًا من خمسة مسارات. في هذه الرحلة تتعرف على المسارات، وتكتشف ميولك، وتجرّب طبيعة كل مسار، ثم ترى المسار الأقرب إليك.</p><p class="note">المدة نحو 20 دقيقة، ويُحفظ تقدمك على جوالك.</p></section>
  <form class="card" id="reg" novalidate><div class="f"><label for="nm">الاسم الثلاثي</label><input type="text" id="nm" autocomplete="name" value="${esc(S.name)}" placeholder="مثال: فهد سعيد الزهراني"></div>${err?`<p class="err" role="alert">${err}</p>`:""}<button class="btn" type="submit">ابدأ</button><p class="note">يُستخدم اسمك لإرسال نتيجتك إلى رائد النشاط فقط.</p></form>`);
  $("#reg").onsubmit=e=>{e.preventDefault();const n=$("#nm").value.trim().replace(/\s+/g," ");if(n.split(" ").length<3)return register("اكتب اسمك الثلاثي.");S.name=n;S.t0=Date.now();save();home()};
}
/* pre / post questions */
function startQ(kind){
  const pre=kind==="pre";const A={d:null,l:null,cf:null};
  const draw=()=>{render(`<section class="card pop"><h2 style="font-size:22px">${pre?"نقطة البداية":"بعد الرحلة"}</h2><p class="note">${pre?"أجب بصدق؛ لا توجد إجابة صحيحة أو خاطئة هنا.":"أجب عن الأسئلة نفسها مرة أخرى لنعرف ما الذي تغيّر."}</p>
    <div class="f"><label>هل حددت المسار الذي ستختاره؟</label><div class="chips">${[["y","نعم"],["n","ليس بعد"]].map(([k,t])=>`<button type="button" class="chip" data-d="${k}" aria-pressed="${A.d===k}">${t}</button>`).join("")}</div></div>
    <div class="f"><label>أي مسار تميل إليه الآن؟</label><div class="chips">${D.paths.map(p=>`<button type="button" class="chip" data-l="${p.id}" aria-pressed="${A.l===p.id}">${p.ic} ${p.t}</button>`).join("")}<button type="button" class="chip" data-l="x" aria-pressed="${A.l==="x"}">لا أعرف بعد</button></div></div>
    <div class="f"><label>ما مدى ثقتك في اختيارك؟</label><div class="scale">${[1,2,3,4,5].map(v=>`<button type="button" data-c="${v}" aria-pressed="${A.cf===v}">${v}</button>`).join("")}</div><div class="scale-l"><span>غير واثق</span><span>واثق جدًا</span></div></div>
    <button class="btn" id="nx" type="button" ${A.d&&A.l&&A.cf?"":"disabled"}>التالي: ${pre?"أسئلة عن المسارات":"الأسئلة الختامية"}</button></section>`);
    app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{A.d=b.dataset.d;draw()});
    app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{A.l=b.dataset.l;draw()});
    app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{A.cf=+b.dataset.c;draw()});
    $("#nx").onclick=()=>knowQ(kind,A)};
  draw();
}
function knowQ(kind,A){const items=D.know.map(shuf);let i=0;const k=[];
  const step=()=>{const it=items[i];render(`<section class="card pop"><div class="qh"><span>ماذا تعرف عن المسارات؟</span><span>${i+1} / ${items.length}</span></div><div class="prog"><i style="width:${i/items.length*100}%"></i></div><p class="q">${esc(it.q)}</p><div class="opts">${it.o.map((o,j)=>`<button class="opt" type="button" data-j="${j}">${esc(o)}</button>`).join("")}</div></section>`);
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{k.push(+b.dataset.j===it.a?1:0);i++;if(i<items.length)step();else{S[kind]={...A,k};save();kind==="pre"?hubIntro():result(true)}})};
  step();
}
function hubIntro(){render(`<section class="card hero pop"><div class="fan" aria-hidden="true"><span>🔎</span><span>🪞</span><span>🧪</span></div><h2 style="font-size:24px">ثلاث خطوات تفصلك عن نتيجتك</h2><p>تعرّف على المسارات، ثم أجب عن عبارات الميول، ثم جرّب تحديًا من كل مسار. بعدها تظهر لك نسبة توافقك مع كل مسار.</p><button class="btn" id="go" type="button">لنبدأ</button></section>`);$("#go").onclick=hub}
function hub(){const seenN=Object.keys(S.seen).length,ready=S.inv&&S.ch;
  const st=(n,done,t,d,act)=>`<button class="step ${done?"done":""}" type="button" data-go="${act}"><span class="n">${done?"✓":n}</span><span class="tx"><b>${t}</b><small>${d}</small></span><span class="go">${done?"مراجعة":"ابدأ"}</span></button>`;
  render(`<section class="card"><b style="font-family:var(--display);font-size:18px">أهلًا ${esc(S.name.split(" ")[0])}</b><p class="note">أكمل الخطوتين الثانية والثالثة لتظهر نتيجتك. الخطوة الأولى تساعدك على الإجابة بوعي.</p></section>
  ${st(1,seenN>=5,"اكتشف المسارات",`تعرّفت على ${seenN} من 5 مسارات`,"disc")}
  ${st(2,!!S.inv,"اعرف نفسك","25 عبارة عن ميولك واهتماماتك","inv")}
  ${st(3,!!S.ch,"جرّب المسار","10 تحديات قصيرة تشبه الدراسة في كل مسار","ch")}
  <button class="btn amber" id="fin" type="button" ${ready?"":"disabled"}>اعرض نتيجتي</button>`);
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>({disc,inv,ch:chall})[b.dataset.go]());
  $("#fin").onclick=()=>startQ("post");
}
function pathCard(p,open){return `<details class="pc" style="--pc:${p.c}" data-p="${p.id}" ${open?"open":""}><summary><span class="pi" aria-hidden="true">${p.ic}</span><b>${p.t}</b></summary><div class="body"><p>${p.d}</p><div class="kv"><div><h4>ماذا ستدرس؟</h4><ul>${p.study.map(x=>`<li>${x}</li>`).join("")}</ul></div><div><h4>مهارات تحتاجها</h4><ul>${p.skills.map(x=>`<li>${x}</li>`).join("")}</ul></div><div><h4>تخصصات جامعية</h4><ul>${p.majors.map(x=>`<li>${x}</li>`).join("")}</ul></div><div><h4>وظائف مستقبلية</h4><ul>${p.jobs.map(x=>`<li>${x}</li>`).join("")}</ul></div></div></div></details>`}
function disc(){render(`<section class="card"><h2 style="font-size:22px">اكتشف المسارات الخمسة</h2><p class="note">افتح كل مسار لتتعرف عليه. تُدرس هذه المسارات بعد السنة الأولى المشتركة.</p></section>${D.paths.map(p=>pathCard(p,false)).join("")}<button class="btn" id="bk" type="button">عودة إلى الخطوات</button>`);
  app.querySelectorAll(".pc").forEach(d=>d.addEventListener("toggle",()=>{if(d.open){S.seen[d.dataset.p]=1;save()}}));$("#bk").onclick=hub}
const LK=["لا تنطبق عليّ","تنطبق قليلًا","تنطبق إلى حد ما","تنطبق كثيرًا","تنطبق تمامًا"];
function inv(){const r=[];let i=0;
  const step=()=>{const [p,t]=D.inv[i];render(`<section class="card pop"><div class="qh"><span>اعرف نفسك</span><span>${i+1} / ${D.inv.length}</span></div><div class="prog"><i style="width:${i/D.inv.length*100}%"></i></div><p class="q">${esc(t)}</p><div class="likert">${LK.map((l,j)=>`<button type="button" data-v="${j+1}"><i>${j+1}</i>${l}</button>`).join("")}</div>${i?`<button class="btn ghost" id="pv" type="button">السابق</button>`:""}</section>`);
    app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{r[i]=+b.dataset.v;i++;if(i<D.inv.length)step();else{S.inv=r;save();hub()}});const pv=$("#pv");if(pv)pv.onclick=()=>{i--;step()}};
  step();
}
function chall(){const items=D.ch.map(shuf);for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}
  const res={};let i=0;
  const step=()=>{const it=items[i],p=P[it.p];render(`<section class="card pop" style="--pc:${p.c}"><div class="qh"><span>${p.ic} تحدٍّ من ${p.t}</span><span>${i+1} / ${items.length}</span></div><div class="prog"><i style="width:${i/items.length*100}%"></i></div><p class="q">${esc(it.q)}</p><div class="opts">${it.o.map((o,j)=>`<button class="opt" type="button" data-j="${j}">${esc(o)}</button>`).join("")}</div><div id="fb"></div></section>`);
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const ok=+b.dataset.j===it.a;app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.j===it.a)x.classList.add("ok")});if(!ok)b.classList.add("no");
      $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}" role="status"><b>${ok?"إجابة صحيحة":"الإجابة الصحيحة مظللة بالأخضر"}</b>${esc(it.e)}</div><p class="note" style="margin-top:12px;font-weight:700;color:var(--fg)">هل استمتعت بهذا النوع من الأسئلة؟</p><div class="chips" style="margin-top:6px">${[[1,"لا"],[2,"إلى حد ما"],[3,"نعم كثيرًا"]].map(([v,t])=>`<button type="button" class="chip" data-e="${v}">${t}</button>`).join("")}</div>`;
      app.querySelectorAll("[data-e]").forEach(e=>e.onclick=()=>{(res[it.p]=res[it.p]||{c:0,e:0,n:0});res[it.p].c+=ok?1:0;res[it.p].e+=+e.dataset.e;res[it.p].n++;i++;if(i<items.length)step();else{S.ch=res;save();hub()}})})};
  step();
}
function fits(){const f={};D.paths.forEach(p=>{const rs=D.inv.map((x,i)=>x[0]===p.id?S.inv[i]:null).filter(v=>v!=null);const iv=(rs.reduce((a,b)=>a+b,0)/rs.length-1)/4;const c=S.ch[p.id]||{c:0,e:2,n:1};
  f[p.id]=Math.round((0.6*iv+0.25*(c.c/c.n)+0.15*((c.e/c.n-1)/2))*100)});return f}
function result(fresh){const f=fits();const order=D.paths.slice().sort((a,b)=>f[b.id]-f[a.id]);const best=order[0];
  const top=D.inv.map((x,i)=>({p:x[0],t:x[1],v:S.inv[i]})).filter(x=>x.p===best.id&&x.v>=4).slice(0,3);
  const kp=S.pre.k.reduce((a,b)=>a+b,0),kq=S.post.k.reduce((a,b)=>a+b,0);
  render(`<section class="card hero pop"><p class="note">نتيجة ${esc(S.name)}</p><h2 style="font-size:24px">نسبة توافقك مع المسارات</h2></section>
  <section class="card"><div class="fit">${order.map(p=>`<div class="fr" style="--pc:${p.c}"><span>${p.ic} ${p.t}</span><div class="bar"><i style="width:${f[p.id]}%"></i></div><span class="v">${f[p.id]}%</span></div>`).join("")}</div><p class="note">تُحسب النسبة من ميولك (60%) وأدائك في التحديات (25%) واستمتاعك بها (15%).</p></section>
  <section class="card best" style="--pc:${best.c}"><p class="note">المسار الأقرب إليك</p><h2>${best.ic} ${best.t}</h2><p style="margin:0">${best.d}</p>${top.length?`<p style="margin:0"><b>لأنك قلت:</b></p><ul style="margin:0;padding-inline-start:20px">${top.map(x=>`<li>${esc(x.t)}</li>`).join("")}</ul>`:""}<div class="kv"><div><h4>تخصصات جامعية</h4><ul>${best.majors.map(x=>`<li>${x}</li>`).join("")}</ul></div><div><h4>وظائف مستقبلية</h4><ul>${best.jobs.map(x=>`<li>${x}</li>`).join("")}</ul></div></div>
  ${order[1]&&f[best.id]-f[order[1].id]<=5?`<p class="warn">نسبتك قريبة أيضًا من ${order[1].t} (${f[order[1].id]}%). ناقش الخيارين مع الموجه الطلابي.</p>`:""}</section>
  <section class="card"><h3 style="font-size:17px">ما الذي تغيّر بعد الرحلة؟</h3><div class="cmp"><div><small>الثقة في الاختيار</small><b style="font-size:16px">من ${S.pre.cf} إلى ${S.post.cf}</b></div><div><small>المعرفة بالمسارات</small><b style="font-size:16px">من ${kp} إلى ${kq}</b></div><div><small>المسار الذي تميل إليه</small><b style="font-size:14px">${S.post.l==="x"?"لم تحدد":P[S.post.l].t}</b></div></div>
  ${S.post.l!=="x"&&S.post.l!==best.id?`<p class="warn">تميل إلى ${P[S.post.l].t}، ونتيجتك الأعلى في ${best.t}. لا بأس في ذلك، لكن يفيدك أن تناقش الأمر مع الموجه الطلابي.</p>`:""}</section>
  <section class="card"><h3 style="font-size:17px">خطتي للاستعداد</h3><p class="note">اختر خطوة واحدة على الأقل ستلتزم بها هذا الفصل.</p><div class="chk">${D.plan.map((t,i)=>`<label><input type="checkbox" data-pl="${i}" ${S.plan.includes(i)?"checked":""}>${t}</label>`).join("")}</div></section>
  <section class="card"><p class="warn">هذه النتيجة استرشادية لمساعدتك على الاختيار. التسكين الرسمي في المسارات يتم وفق معايير وزارة التعليم ورغبتك ودرجاتك.</p><button class="btn amber" id="snd" type="button" ${S.plan.length?"":"disabled"}>إرسال نتيجتي إلى رائد النشاط</button><button class="btn ghost" id="again" type="button">إعادة الرحلة من البداية</button></section>`);
  app.querySelectorAll("[data-pl]").forEach(c=>c.onchange=()=>{const i=+c.dataset.pl;S.plan=c.checked?[...new Set([...S.plan,i])]:S.plan.filter(x=>x!==i);save();$("#snd").disabled=!S.plan.length});
  $("#snd").onclick=()=>S.im?sendView(f,best):imSurvey(h=>render(h),"card",()=>sendView(f,best));
  let sure=false;$("#again").onclick=e=>{if(!sure){sure=true;e.target.textContent="اضغط مرة أخرى لتأكيد الإعادة";return}const n=S.name;S=load();S={v:1,name:n,pre:null,post:null,seen:{},inv:null,ch:null,plan:[],t0:Date.now()};save();home()};
}
/* ---------- قياس أثر المبادرة ---------- */
const IM_Q=["حققت المبادرة الأهداف التي عرفتها في بدايتها","اكتسبت منها معارف ومهارات جديدة","زادت حماسي ورغبتي في المشاركة والتعلم","غيّرت شيئًا إيجابيًا في سلوكي أو ممارستي اليومية","أنا راضٍ عن المبادرة بشكل عام","كانت أنشطتها مناسبة ومحتواها واضحًا","سأستمر في تطبيق ما تعلمته، وأتمنى تطوير المبادرة"];
const IM_O=[[3,"بدرجة مرتفعة"],[2,"بدرجة متوسطة"],[1,"بدرجة منخفضة"]];
function imSurvey(put,card,onDone){const A=(Array.isArray(S.im)&&S.im.length===7?S.im:[0,0,0,0,0,0,0]).slice();let ib=S.ib||"",ii=S.ii||"";
  const draw=()=>{const n=A.filter(Boolean).length;put(`<section class="${card}"><h2 style="font-size:22px;margin:0">قياس أثر المبادرة</h2><p class="note">قبل إرسال نتيجتك: إلى أي درجة تنطبق كل عبارة عليك؟ إجابتك الصادقة تساعدنا على تطوير المبادرة، ولا تؤثر في نتيجتك.</p>
  ${IM_Q.map((q,k)=>`<fieldset class="imq"><legend><span>${k+1}</span>${q}</legend><div class="imo">${IM_O.map(([v,t])=>`<button type="button" data-k="${k}" data-v="${v}" aria-pressed="${A[k]===v}">${t}</button>`).join("")}</div></fieldset>`).join("")}
  <label class="iml">أكثر ما أعجبني في المبادرة (اختياري)<textarea id="imb" maxlength="200" rows="2">${esc(ib)}</textarea></label>
  <label class="iml">اقتراحي لتحسينها (اختياري)<textarea id="imi" maxlength="200" rows="2">${esc(ii)}</textarea></label>
  <p class="note" role="status">أجبت عن ${n} من 7 عبارات</p><button class="btn" id="imok" type="button" ${n===7?"":"disabled"}>حفظ والمتابعة إلى الإرسال</button></section>`);
    document.querySelectorAll(".imo button").forEach(b=>b.onclick=()=>{A[+b.dataset.k]=+b.dataset.v;ib=document.getElementById("imb").value;ii=document.getElementById("imi").value;const y=window.scrollY;draw();window.scrollTo(0,y)});
    document.getElementById("imok").onclick=()=>{S.im=A;S.ib=document.getElementById("imb").value.trim().slice(0,200);S.ii=document.getElementById("imi").value.trim().slice(0,200);save();onDone()}};
  draw();window.scrollTo(0,0)}
/* ---------- الإرسال المباشر إلى جدول رائد النشاط ---------- */
const SEND_URL="https://script.google.com/macros/s/AKfycbzfmBUcACJSe_ehcPxWdLVccv805RzSAdgJQTHv9E7ALR3ZC9z2nHLTBz5WKexHYDKz/exec";
function autoSend(ini,m,code){const el=document.getElementById("as");if(!el) return;
  const ok=()=>{el.className="as ok";el.textContent="✓ وصلت نتيجتك إلى رائد النشاط مباشرة، ولا تحتاج إلى إرسالها عبر واتساب.";const w=document.getElementById("wan");if(w) w.textContent="إرسال نسخة عبر واتساب اختياري، للاحتياط فقط."};
  if(!SEND_URL||!window.fetch){el.className="as off";el.textContent="أرسل نتيجتك عبر واتساب من الزر التالي.";return}
  if(S.sent===code) return ok();
  el.className="as";el.textContent="جارٍ إرسال نتيجتك إلى رائد النشاط…";
  fetch(SEND_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({ini,n:m.n||"",g:m.g||"",c:m.c||"",code})})
   .then(()=>{S.sent=code;save();ok()}).catch(()=>{el.className="as off";el.textContent="تعذّر الإرسال المباشر الآن. أرسل نتيجتك عبر واتساب من الزر التالي."})}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h.toString(36).toUpperCase().padStart(6,"0").slice(-6)}
function sendView(f,best){const p={n:S.name,c:"1",pre:S.pre,post:S.post,fit:f,top:best.id,plan:S.plan,im:S.im||null,ib:S.ib||"",ii:S.ii||"",t:Date.now()};
  const b=btoa(unescape(encodeURIComponent(JSON.stringify(p)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");const code="AM1."+b+"."+hash(SALT+b);
  const msg=`اعرف مسارك — نتيجة الطالب\nالاسم: ${S.name}\nالمسار الأقرب: ${best.t} (${f[best.id]}%)\nالمسار الذي أميل إليه: ${S.post.l==="x"?"لم أحدد":P[S.post.l].t}\nالثقة في الاختيار: من ${S.pre.cf} إلى ${S.post.cf}${S.im?"\nقياس الأثر: تم":""}\n\n${code}`;
  render(`<section class="card pop"><h2 style="font-size:22px">إرسال النتيجة</h2><div class="as" id="as" role="status"></div><p class="note" id="wan">إن لم يظهر تأكيد الوصول، اضغط زر واتساب فتفتح محادثة رائد النشاط مباشرة، ثم أرسل الرسالة كما هي دون تعديل؛ فالرمز في آخرها يحمل نتيجتك.</p>
  <a class="btn" href="https://wa.me/966535597468?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">فتح واتساب وإرسال الرسالة</a><button class="btn ghost" id="cp" type="button">نسخ الرسالة</button><p class="note" id="cpm" role="status"></p>
  <details><summary class="note" style="cursor:pointer">عرض الرسالة</summary><pre id="msg" style="white-space:pre-wrap;word-break:break-all;font-family:var(--body);font-size:12px;background:var(--sunk);border-radius:10px;padding:10px">${esc(msg)}</pre></details><button class="btn ghost" id="bk" type="button">العودة إلى نتيجتي</button></section>`);
  $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(msg);$("#cpm").textContent="نُسخت الرسالة. الصقها في محادثة رائد النشاط وأرسلها."}catch(e){$("details").open=true;const r=document.createRange();r.selectNodeContents($("#msg"));const s=getSelection();s.removeAllRanges();s.addRange(r);$("#cpm").textContent="حدّد النص الظاهر وانسخه يدويًا."}};
  $("#bk").onclick=()=>result();autoSend("masar",{n:S.name,g:"الأول الثانوي",c:"1"},code);
}
home();
</script>
